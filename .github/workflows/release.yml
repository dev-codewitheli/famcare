name: Release HomeBell

# Push a tag like v0.4.0 to build the signed APKs and publish a GitHub Release.
# Needs the repository secrets described in docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/homebell
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true

      - name: Check release secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          for name in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (see docs/RELEASING.md)"; exit 1; fi
          done

      # Same files a developer keeps locally (and out of git): Firebase config + signing key.
      # Secrets pasted from a Windows clipboard end in "\r\n", which base64 rejects and which
      # would become part of the password, so whitespace is stripped first.
      - name: Restore Firebase config and signing key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          decode() { printf '%s' "$1" | tr -d '\r\n\t ' | base64 --decode; }
          decode "$GOOGLE_SERVICES_JSON" > android/app/google-services.json \
            || { echo "::error::GOOGLE_SERVICES_JSON is not valid base64"; exit 1; }
          decode "$KEYSTORE_BASE64" > "$RUNNER_TEMP/homebell-release.jks" \
            || { echo "::error::KEYSTORE_BASE64 is not valid base64"; exit 1; }
          password="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/homebell-release.jks" \
            "storePassword=$password" \
            "keyAlias=homebell" \
            "keyPassword=$password" > android/key.properties
          # Fail here, with a clear message, rather than deep inside the Gradle build.
          keytool -list -keystore "$RUNNER_TEMP/homebell-release.jks" -storepass "$password" -alias homebell > /dev/null \
            || { echo "::error::KEYSTORE_PASSWORD doesn't open the keystore"; exit 1; }

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build signed APKs
        env:
          API_BASE_URL: ${{ vars.HOMEBELL_API_BASE_URL || 'https://famcare-server.onrender.com' }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=AUTH_MODE=firebase \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/dist/HomeBell-$version-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/dist/HomeBell-$version-arm32.apk"

      # Resource shrinking silently drops resources looked up by name (0.4.0 froze on the
      # splash screen, and sign-in failed, because of it). See res/raw/keep.xml.
      - name: Check resources looked up by name survived shrinking
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          for apk in "$GITHUB_WORKSPACE"/dist/*.apk; do
            resources="$("$aapt2" dump resources "$apk")"
            for name in drawable/ic_stat_bell string/default_web_client_id; do
              grep -q " $name\$" <<< "$resources" || { echo "::error::$name is missing from $(basename "$apk")"; exit 1; }
            done
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Download:** `HomeBell-…-arm64.apk` for almost all phones from the last ~8 years;
            `…-arm32.apk` only for older or budget phones where arm64 won't install.

            After installing, open HomeBell → Settings → Phone setup and finish every step so
            rings get through. Privacy policy: https://dev-codewitheli.github.io/homebell/privacy.html
