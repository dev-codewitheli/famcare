# Local PostgreSQL for the "postgres" profile:
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=postgres ./gradlew bootRun
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: famcare
      POSTGRES_USER: famcare
      POSTGRES_PASSWORD: famcare
    ports:
      - "5432:5432"
    volumes:
      - famcare-db:/var/lib/postgresql/data

volumes:
  famcare-db:
